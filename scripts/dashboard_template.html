<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>สาเหตุหุ้นขยับเกิน 5%</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--tx:#1d1d1b;--mut:#6b6a63;--bd:#e3e1d8;--up:#0f7b4f;--dn:#c0392b;--ac:#2a5db0;--lo:#8a8a82;--wn:#9a7200}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#15161a;--card:#1e2026;--tx:#ecebe6;--mut:#a3a29a;--bd:#2f323a;--up:#3ecf8e;--dn:#ff7a6b;--ac:#7aa7ff;--lo:#7c7c75;--wn:#e0b23c}}
:root[data-theme=dark]{--bg:#15161a;--card:#1e2026;--tx:#ecebe6;--mut:#a3a29a;--bd:#2f323a;--up:#3ecf8e;--dn:#ff7a6b;--ac:#7aa7ff;--lo:#7c7c75;--wn:#e0b23c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 "IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif}
main{max-width:1080px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:17px;margin:0 0 6px}h3{font-size:15px;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px;margin:0 0 16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 16px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}
.kpi .l{color:var(--mut);font-size:12px}.kpi .v{font-size:22px;font-weight:600}.kpi .s{color:var(--mut);font-size:12px}
.warn{border-left:4px solid var(--wn)}
.up{color:var(--up)}.dn,.down{color:var(--dn)}
svg{width:100%;height:auto;display:block}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.tabs button{border-radius:8px;padding:6px 14px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
button{font:inherit;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:999px;padding:4px 12px;cursor:pointer}
button[aria-pressed=true],button[aria-selected=true]{background:var(--ac);color:#fff;border-color:var(--ac)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:660px}
th,td{padding:8px 10px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:500;font-size:13px}td.n,th.n{text-align:right;white-space:nowrap}
.tag{display:inline-block;font-size:12px;border:1px solid var(--bd);border-radius:6px;padding:0 6px;color:var(--mut);margin:0 4px 2px 0}
.tag.high,.tag.tested{color:var(--up);border-color:var(--up)}.tag.mid,.tag.company{color:var(--ac);border-color:var(--ac)}.tag.low{color:var(--lo)}.tag.cal,.tag.hypothesis{color:var(--wn);border-color:var(--wn)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:720px){.grid2{grid-template-columns:1fr}}
.watch{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.w{border:1px solid var(--bd);border-radius:8px;padding:12px}.w dl{margin:6px 0 0}.w dt{color:var(--mut);font-size:12px;margin-top:6px}.w dd{margin:0}
ul{margin:6px 0 0;padding-left:20px}li{margin:0 0 6px}.pg{color:var(--mut);font-size:12px}
a{color:var(--ac);overflow-wrap:anywhere}.mut{color:var(--mut)}
</style>
</head>
<body>
<main>
<h1>วันที่ราคาปิดขยับเกิน 5% เกิดจากอะไร และต้องติดตามอะไรต่อ</h1>
<p class="sub" id="sub"></p>
<div class="card" id="overview"></div>
<div class="tabs" id="tabs" role="tablist"></div>
<div id="stock"></div>
<p class="sub">ข้อมูลเพื่อการเรียนรู้และช่วยตั้งคำถามในการวิเคราะห์ ไม่ใช่คำแนะนำการลงทุน ไม่มีคำสั่งซื้อขายหรือราคาเป้าหมาย ผู้ใช้เป็นผู้ตัดสินใจเอง</p>
</main>
<script id="data" type="application/json">/*DATA*/null</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const S=D.stocks,OPP=D.oppday||{},WATCH=D.watch||{},NEXT=D.next||{},FAC=D.factors||{};
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fd=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s);return m?(+m[3])+' '+MON[+m[2]-1]+' '+m[1]:s};
const f1=v=>v==null?'–':(v>0?'+':'')+v.toFixed(2)+'%';
const x1=v=>v==null?'–':v.toFixed(1)+' เท่า';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TYPE={earnings:'งบการเงิน',company_news:'ข่าวบริษัท',market:'ตลาด/มหภาค'};
const CLS={xd:'วัน XD',earnings:'ช่วงตอบสนองต่องบ',market:'ตามตลาด',reversal:'เด้งกลับ',low_volume:'volume ปกติ',mid_volume:'volume 1.5–3 เท่า',high_volume:'volume ≥3 เท่า'};
const CONF={high:'สูง',mid:'ปานกลาง',low:'ต่ำ'};
const LEVEL={company:'บริษัทระบุเอง',tested:'ทดสอบกับข้อมูลแล้ว',hypothesis:'สมมติฐาน ยังไม่ยืนยัน'};
const all=Object.values(S),sum=k=>all.reduce((a,s)=>a+s.counts[k],0),total=all.reduce((a,s)=>a+s.events.length,0);
document.getElementById('sub').textContent='เกณฑ์ 2 ชั้น: (1) รายวัน ราคาปิดขยับมากกว่า 5% เทียบปิดวันก่อน (2) รายสัปดาห์ ราคาปิดวันทำการสุดท้ายของสัปดาห์ขยับมากกว่า 10% เทียบสัปดาห์ก่อน · ราคาและ volume จาก Yahoo Finance (ดึง 2 Nov 2026 แหล่งเดียว แท่งล่าสุดอาจยังไม่ปิด) · ข่าวจากหน้าข่าวสาธารณะของ SET';
document.getElementById('overview').innerHTML='<h2>ภาพรวม 4 หุ้น</h2><p class="sub">'+total+' วัน: พบสาเหตุ '+sum('found')+' · มีเบาะแส '+sum('lead')+' · ยังไม่พบ '+sum('unknown')+' — ส่วนใหญ่ยังตอบไม่ได้ และแสดงตามจริง</p><div class="tw"><table><thead><tr><th>หุ้น</th><th class="n">พบสาเหตุ</th><th class="n">งบ</th><th class="n">ข่าวบริษัท</th><th class="n">ตลาด</th><th class="n">มีเบาะแส</th><th class="n">ยังไม่พบ</th><th class="n">สัปดาห์ >10%</th><th class="n">beta</th><th class="n">ผันผวน/วัน</th></tr></thead><tbody>'+all.map(s=>`<tr><td>${esc(s.ticker)}</td><td class="n">${s.counts.found}</td><td class="n">${s.stats.earnings.n}</td><td class="n">${s.stats.company_news.n}</td><td class="n">${s.stats.market.n}</td><td class="n">${s.counts.lead}</td><td class="n">${s.counts.unknown}</td><td class="n">${s.weekly.weeks.length}/${s.weekly.weeks_total}</td><td class="n">${s.beta}</td><td class="n">${s.daily_sd}%</td></tr>`).join('')+'</tbody></table></div>';
let cur=Object.keys(S)[0],flt='high_volume';

function chart(s){
 const P=s.prices,E=s.events,W=1000,H=330,L=44,R=12,T=14,B=28;
 const ps=P.map(r=>r.p),lo=Math.min(...ps)*0.97,hi=Math.max(...ps)*1.03;
 const X=i=>L+i/(P.length-1)*(W-L-R),Y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B);
 const idx={};P.forEach((r,i)=>idx[r.d]=i);
 let o=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="กราฟราคาปิดรายวัน ${esc(s.ticker)}">`;
 for(let k=0;k<=4;k++){const v=lo+(hi-lo)*k/4,y=Y(v);o+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--bd)"/><text x="${L-6}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--mut)">${v>=10?v.toFixed(0):v.toFixed(1)}</text>`;}
 let lastY='';P.forEach((r,i)=>{const y=r.d.slice(0,4),m=+r.d.slice(5,7);const key=y+(m<=6?'a':'b');if(key!==lastY&&(m===1||m===7||i===0)){lastY=key;o+=`<text x="${X(i)}" y="${H-8}" font-size="11" fill="var(--mut)" text-anchor="start">${MON[m-1]} ${y}</text>`;}});
 o+=`<polyline fill="none" stroke="var(--mut)" stroke-width="1.2" points="${P.map((r,i)=>X(i).toFixed(1)+','+Y(r.p).toFixed(1)).join(' ')}"/>`;
 E.forEach(e=>{const i=idx[e.date];if(i==null)return;const c=e.dir==='up'?'var(--up)':'var(--dn)',big=e.status==='found';
  o+=`<circle cx="${X(i)}" cy="${Y(e.close)}" r="${big?7:3.2}" fill="${c}" fill-opacity="${big?1:.45}" stroke="var(--card)" stroke-width="1"><title>${fd(e.date)} ${f1(e.ret)} · ${esc(e.why)}</title></circle>`;});
 return o+'</svg>';
}

function hist(s,key){
 if(!key)return 'ไม่มีวันที่พบสาเหตุผูกกับหัวข้อนี้';
 const t=s.stats[key];
 if(t.n<3)return 'พบ '+t.n+' ครั้ง: ข้อมูลน้อย สรุปไม่ได้';
 return 'พบ '+t.n+' ครั้ง (ขึ้น '+t.up+' · ลง '+t.down+') · ค่ากลาง T+5 '+f1(t.median_after5)+' · ไปต่อทิศเดิม '+t.cont+' ครั้ง';
}

function limits(s){
 const c=s.coverage,items=[];
 items.push('ราคา '+s.bars+' แท่ง '+fd(s.first)+' – '+fd(s.last)+(s.bars<1200?' (ไม่ถึง 5 ปี เพราะเข้าตลาดทีหลัง)':' (5 ปี)')+' · Yahoo แหล่งเดียว ยังไม่ได้ตรวจกับ TradingView · close ปรับหุ้นปันผลแต่ไม่ปรับปันผลเงินสด');
 items.push('ตัวแทนตลาดคือ TDEX (กองทุน SET50) เพราะ Yahoo ไม่มีดัชนี SET ย้อนหลัง จึงอาจไม่สะท้อนหุ้นขนาดกลาง-เล็ก · beta '+s.beta);
 items.push('สแกนเอกสาร '+c.files_scanned+' ไฟล์จาก AllCompany (ข้าม '+c.files_skipped+') และดูข่าว SET รอบวันเกิดเหตุ ไม่ได้ครบทุกข่าวใน 5 ปี · เวลาในชื่อไฟล์งบอาจไม่ตรงกับ SET จึงใช้เวลาจาก SET ก่อน');
 items.push('งบเทียบ YoY เท่านั้น ยังไม่ได้เทียบกับที่ตลาดคาด ราคาจึงอาจขยับสวนกำไรได้ · ไม่มีข้อมูลเงินต่างชาติ short sale NVDR และ big lot ย้อนหลังจึงยังตอบไม่ได้ว่าใครซื้อขาย');
 if(s.before_first_filing)items.push(s.before_first_filing+' วันเกิดก่อนงบฉบับแรกในชุดข้อมูล ('+fd(s.first_filing)+') จึงตรวจกับงบไม่ได้');
 return '<h2>ข้อจำกัดของข้อมูล</h2><ul>'+items.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ul>';
}


function factLink(t,names){
 if(!names||!names.length)return '<span class="mut">ยังไม่มีปัจจัยในแผนที่ ต้องเพิ่มเมื่อมีหลักฐาน</span>';
 return names.map(n=>{const f=(FAC[t]||[]).find(x=>x.f===n);return f?`<div><b>${esc(f.f)}</b> <span class="tag">${esc(f.swot)}</span>${f.force&&f.force!=='—'?`<span class="tag">${esc(f.force)}</span>`:''}<span class="tag ${f.level}">${LEVEL[f.level]}</span></div>`:esc(n);}).join('');
}
const fm=(v,u)=>v==null?'–':u==='%'?v.toFixed(2)+'%':v.toLocaleString('en-US',{maximumFractionDigits:1})+' ล้าน';
const sg=v=>v==null?'–':(v>0?'+':'')+v.toFixed(1);
function pnlTable(t,p){
 const tr=p.rows.map(r=>`<tr><td>${esc(r.name)}</td><td class="n">${fm(r.cur,r.unit)}</td><td class="n">${fm(r.prior,r.unit)}</td><td class="n">${r.unit==='%'?(r.delta==null?'–':sg(r.delta)+' pp'):(r.pct==null?'–':sg(r.pct)+'%')}</td><td class="n ${r.profit_effect>0?'up':r.profit_effect<0?'dn':''}">${r.profit_effect==null?'–':sg(r.profit_effect)}</td><td>${factLink(t,r.links)}</td></tr>`).join('');
 const dr=p.drivers.map(d=>`${esc(d.line)} ${sg(d.effect)} ล้านบาท`).join(' · ');
 return `<div class="tw"><table><thead><tr><th>บรรทัดงบ</th><th class="n">ไตรมาสนี้</th><th class="n">ปีก่อน</th><th class="n">เปลี่ยน YoY</th><th class="n">ผลต่อกำไร (ล้านบาท)</th><th>โยงปัจจัยธุรกิจ (SWOT / 5 Forces)</th></tr></thead><tbody>${tr}</tbody></table></div><div class="pg">สะพานกำไร: ${p.bridge.map(b=>esc(b.item)+' '+sg(b.delta)).join(' · ')}</div>${dr?`<div>ตัวขับกำไรที่ใหญ่สุด 2 อันดับ: <b>${dr}</b></div>`:''}`;
}
function pnlBlock(s,e){
 const t=s.ticker,caveat='<div class="pg">โยงปัจจัยด้วยตรรกะว่าบรรทัดงบนี้ได้รับผลจากอะไร ไม่ได้พิสูจน์ว่าราคาขยับเพราะปัจจัยนั้น · เทียบ YoY เท่านั้น ยังไม่ได้เทียบกับที่ตลาดคาด · Q4 = ทั้งปีลบ 9 เดือน</div>';
 if(e.pnl)return `<tr><td colspan="8"><details open><summary>แยกงบ ${esc(e.pnl.quarter)} (ยื่น ${esc(e.pnl.filed)}) — รายได้ GPM COGS ค่าขาย ค่าบริหาร</summary>${pnlTable(t,e.pnl)}${caveat}</details></td></tr>`;
 if(e.pnl_follow&&e.pnl_follow.length)return `<tr><td colspan="8"><details><summary>ผลที่ตามมาในงบ (ไตรมาสที่เกิดเหตุและถัดไป) — ไม่ได้พิสูจน์ว่ามาจากเหตุการณ์นี้</summary>${e.pnl_follow.map(p=>`<h3>${esc(p.quarter)}</h3>${pnlTable(t,p)}`).join('')}${caveat}</details></td></tr>`;
 return '';
}
function weeklyCard(s){
 const w=s.weekly.weeks,c=k=>w.filter(x=>x.status===k).length;
 const rows=w.slice().reverse().map(x=>{
  const days=x.days.map(d=>`<div class="pg">${fd(d.date)} ${f1(d.ret)} · ${d.status==='found'?'พบสาเหตุ':d.status==='lead'?'เบาะแส':'ยังไม่พบ'}</div>`).join('');
  return `<tr><td>${fd(x.start)} – ${fd(x.end)}<div class="pg">${esc(x.week)}</div></td><td class="n ${x.dir}">${f1(x.ret)}</td><td class="n">${f1(x.mkt)}</td><td class="n">${x1(x.vol_ratio)}</td><td><span class="tag ${x.status==='found'?'high':''}">${x.status==='found'?'พบสาเหตุ':x.status==='lead'?'เบาะแส':'ยังไม่พบ'}</span><span class="tag">${x.kind==='spike'?'มีวันกระโดดเกิน 5% ในสัปดาห์':'สะสมทีละน้อย ไม่มีวันเกิน 5% ทิศเดียวกัน'}</span>${x.market?'<span class="tag cal">ตลาดอธิบายเกินครึ่ง</span>':''}${x.why?esc(x.why):''}${days}</td></tr>`;}).join('');
 return `<div class="card"><h2>รายสัปดาห์เกิน ±10%</h2><p class="sub">${w.length} จาก ${s.weekly.weeks_total} สัปดาห์ · พบสาเหตุ ${c('found')} · เบาะแส ${c('lead')} · ยังไม่พบ ${c('unknown')} · สะสมทีละน้อย ${w.filter(x=>x.kind==='drift').length} · สัปดาห์ที่มีวันกระโดดจะรับสาเหตุจากวันนั้น ถ้าวันนั้นพบสาเหตุและทิศเดียวกัน</p><div class="tw"><table><thead><tr><th>สัปดาห์</th><th class="n">เปลี่ยน</th><th class="n">ตลาด (TDEX)</th><th class="n">volume สัปดาห์</th><th>สถานะ / วันในสัปดาห์</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}
function qCard(s){
 const cols=[['rev','รายได้'],['gpm','GPM %'],['sell_pct','ค่าขาย % รายได้'],['admin_pct','ค่าบริหาร % รายได้'],['fin','ต้นทุนการเงิน'],['ecl','ผลขาดทุนเครดิต'],['np','กำไรสุทธิ'],['yoy_np','กำไร YoY %']].filter(c=>s.quarters.some(q=>q[c[0]]!=null));
 return `<div class="card"><h2>งบรายไตรมาส ${s.quarters.length} ไตรมาสล่าสุดที่อ่านได้ (ล้านบาท)</h2><div class="tw"><table><thead><tr><th>ไตรมาส</th>${cols.map(c=>`<th class="n">${c[1]}</th>`).join('')}</tr></thead><tbody>${s.quarters.map(q=>`<tr><td>${esc(q.q)}</td>${cols.map(c=>`<td class="n">${q[c[0]]==null?'–':Number(q[c[0]]).toLocaleString('en-US',{maximumFractionDigits:1})}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`;
}

function ctxCols(e){return `<td class="n">${x1(e.ctx.vol_ratio)}</td><td class="n">${f1(e.ctx.mkt)}</td><td class="n">${f1(e.ctx.gap)}</td><td class="n">${f1(e.ctx.after5)}</td>`;}
const HD='<th class="n">volume</th><th class="n">ตลาด</th><th class="n">gap เปิด</th><th class="n">T+5</th>';

function render(){
 const s=S[cur],E=s.events,last=s.prices[s.prices.length-1];
 let h=`<p class="sub">${esc(s.name)} · ${esc(s.group)} · ราคาล่าสุด ${last.p.toFixed(2)} บาท (${fd(last.d)})</p>`;
 h+='<div class="card"><h2>หัวข้อที่ต้องติดตาม</h2><p class="sub">เขียนเป็นเงื่อนไขที่ตรวจได้ · "ทำอะไรต่อ" คือสิ่งที่ควรวิเคราะห์ ไม่ใช่คำแนะนำซื้อขาย</p><div class="watch">'+(WATCH[s.ticker]||[]).map(w=>`<div class="w"><h3>${esc(w.t)}</h3><dl><dt>ล่าสุด</dt><dd>${esc(w.latest)}</dd><dt>เป้าของบริษัท</dt><dd>${esc(w.target)}</dd><dt>สัญญาณที่ต้องทบทวน</dt><dd>${esc(w.signal)}</dd><dt>ประวัติราคา</dt><dd>${esc(hist(s,w.hist))}</dd><dt>ทำอะไรต่อ</dt><dd>${esc(w.next)}</dd></dl><div class="pg">${esc(w.src)}</div></div>`).join('')+'</div></div>';
 h+='<div class="card"><h2>เหตุการณ์ถัดไป</h2><ul>'+(NEXT[s.ticker]||[]).map(n=>`<li>${esc(n.t)}: ${esc(n.d)} <span class="tag hypothesis">คาดจากปีก่อน ยังไม่ยืนยัน</span> <span class="pg">${esc(n.basis)}</span></li>`).join('')+'</ul></div>';
 h+='<div class="kpis">'+[['พบสาเหตุ',s.counts.found+' วัน','มีหลักฐานเนื้อหา'],['มีเบาะแส',s.counts.lead+' วัน','ยังไม่ยืนยัน ไม่นับเป็นพบ'],['ยังไม่พบ',s.counts.unknown+' วัน','จาก '+E.length+' วัน']].map(k=>`<div class="kpi"><div class="l">${k[0]}</div><div class="v">${k[1]}</div><div class="s">${k[2]}</div></div>`).join('')+'</div>';
 const found=E.filter(e=>e.status==='found').slice().reverse();
 h+='<div class="card"><h2>พบสาเหตุ</h2><div class="tw"><table><thead><tr><th>วันที่</th><th class="n">เปลี่ยน</th><th>ประเภท / สาเหตุ / หลักฐาน</th>'+HD+'<th>มั่นใจ</th></tr></thead><tbody>'+found.map(e=>{
  const ev=e.evidence.map(x=>`<div><span class="tag">${esc(x.tier)}</span>${x.src?`<a href="${esc(x.src)}" target="_blank" rel="noopener">${esc(x.src.replace(/^https?:\/\/(www\.)?/,'').slice(0,44))}</a> `:''}<span class="pg">${esc(x.note)}</span></div>`).join('');
  return `<tr><td>${fd(e.date)}</td><td class="n ${e.dir}">${f1(e.ret)}</td><td><span class="tag">${esc(TYPE[e.type])}</span>${esc(e.why)}${e.note?`<div class="pg">${esc(e.note)}</div>`:''}${ev}</td>${ctxCols(e)}<td><span class="tag ${e.conf}">${CONF[e.conf]}</span></td></tr>`+pnlBlock(s,e);}).join('')+'</tbody></table></div></div>';
 h+=weeklyCard(s);
 h+=qCard(s);
 h+='<div class="card"><h2>ปัจจัยธุรกิจ: กระทบตรงไหน และต้องดูตัวเลขอะไร</h2><p class="sub">จัดตาม 5 Forces และ SWOT เฉพาะปัจจัยที่ผูกกับตัวเลขได้</p><div class="tw"><table><thead><tr><th>ปัจจัย</th><th>5 Forces</th><th>SWOT</th><th>กระทบงบตรงไหน</th><th>ตัวเลขที่ดู</th><th>ลักษณะ</th><th>หลักฐาน</th></tr></thead><tbody>'+(FAC[s.ticker]||[]).map(f=>`<tr><td>${esc(f.f)}</td><td>${esc(f.force)}</td><td>${esc(f.swot)}</td><td>${esc(f.channel)}</td><td>${esc(f.metric)}</td><td>${esc(f.nature)}</td><td><span class="tag ${f.level}">${LEVEL[f.level]}</span><div class="pg">${esc(f.src)}</div></td></tr>`).join('')+'</tbody></table></div></div>';
 h+=`<div class="card"><h2>ราคาปิดรายวัน</h2><p class="sub"><span class="up">●</span> ขึ้นแรง · <span class="dn">●</span> ลงแรง · จุดใหญ่ = พบสาเหตุ · จุดเล็ก = ยังไม่ยืนยัน</p>${chart(s)}</div>`;
 h+='<div class="card"><h2>ยังไม่ยืนยันสาเหตุ</h2><p class="sub">แยกจากกลุ่มที่พบสาเหตุ · ไม่พบไม่ได้แปลว่าไม่มีสาเหตุ · เรียง volume มากไปน้อย</p><div class="tools">'+[['high_volume','volume ≥3 เท่า (ค้นก่อน)'],['lead','มีเบาะแส'],['mid_volume','volume 1.5–3 เท่า'],['low_volume','volume ปกติ'],['reversal','เด้งกลับ'],['all','ทั้งหมด']].map(b=>`<button data-f="${b[0]}" aria-pressed="${b[0]===flt}">${b[1]}</button>`).join('')+'</div><div class="tw"><table id="tb"></table></div><p class="sub" id="tbnote"></p></div>';
 const op=OPP[s.ticker];
 if(op)h+=`<div class="grid2"><div class="card"><h2>ตัวขับเคลื่อนตามเอกสารบริษัท</h2><p class="sub">${esc(op.file)}</p><ul>${op.drivers.map(d=>`<li>${esc(d.t)} <span class="pg">[${esc(d.pg)}]</span></li>`).join('')}</ul></div><div class="card"><h2>ความเสี่ยง</h2><p class="sub">${esc(op.risk_note||'')}</p><ul>${op.risks.map(d=>`<li>${esc(d.t)} <span class="pg">[${esc(d.pg)}]</span></li>`).join('')}</ul></div></div>${op.guidance&&op.guidance.length?`<div class="card"><h2>เป้าหมายปี 2026 เทียบผลจริง</h2><div class="tw"><table><thead><tr><th>หัวข้อ</th><th>เป้าหมาย</th><th>ผลจริง</th></tr></thead><tbody>${op.guidance.map(r=>'<tr><td>'+r.map(esc).join('</td><td>')+'</td></tr>').join('')}</tbody></table></div></div>`:''}`;
 h+=`<div class="card warn">${limits(s)}</div>`;
 document.getElementById('stock').innerHTML=h;
 table();
}

function table(){
 const s=S[cur],pool=s.events.filter(e=>e.status!=='found');
 const rows=pool.filter(e=>flt==='all'||(flt==='lead'?e.status==='lead':e.status==='unknown'&&e.cls===flt)).slice().sort((a,b)=>(b.ctx.vol_ratio||0)-(a.ctx.vol_ratio||0));
 document.getElementById('tb').innerHTML='<thead><tr><th>วันที่</th><th class="n">เปลี่ยน</th><th>สถานะ</th>'+HD+'</tr></thead><tbody>'+rows.map(e=>{
  const cal=e.calendar.map(c=>`<span class="tag cal" title="${esc(c.title||c.src)}">${esc(c.title||c.label)} ${esc(fd(c.date))}${c.time?' '+esc(c.time):''} (${esc(c.rel)})</span>`).join('');
  return `<tr><td>${fd(e.date)}</td><td class="n ${e.dir}">${f1(e.ret)}</td><td><span class="tag">${e.status==='lead'?'เบาะแส':'ยังไม่พบ'}</span><span class="tag">${esc(CLS[e.cls])}</span>${esc(e.why)}${e.searched?`<div class="pg">${esc(e.searched)}</div>`:''}${cal?`<div>${cal}</div>`:''}</td>${ctxCols(e)}</tr>`;}).join('')+'</tbody>';
 document.getElementById('tbnote').textContent='แสดง '+rows.length+' จาก '+pool.length+' วัน · ป้าย R = วันแรกที่ตลาดตอบสนองได้ · R+1 = วันทำการถัดไป · เป็นข้อสังเกต ไม่ใช่สาเหตุ';
}

document.getElementById('tabs').innerHTML=Object.keys(S).map(t=>`<button role="tab" data-t="${t}" aria-selected="${t===cur}">${t}</button>`).join('');
document.getElementById('tabs').addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;cur=b.dataset.t;flt='high_volume';document.querySelectorAll('#tabs button').forEach(x=>x.setAttribute('aria-selected',x===b));render();});
document.getElementById('stock').addEventListener('click',ev=>{const b=ev.target.closest('.tools button');if(!b)return;flt=b.dataset.f;document.querySelectorAll('.tools button').forEach(x=>x.setAttribute('aria-pressed',x===b));table();});
render();
</script>
</body>
